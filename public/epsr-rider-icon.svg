<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rider Carbon / Obsidian Canvas -->
    <linearGradient id="riderBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C18" />
      <stop offset="60%" stop-color="#171310" />
      <stop offset="100%" stop-color="#0E0C0A" />
    </linearGradient>

    <!-- Racing Velocity Orange / Fire Gradient -->
    <linearGradient id="riderFireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#F48721" />
      <stop offset="100%" stop-color="#E03100" />
    </linearGradient>

    <!-- Speed Lightning Gold -->
    <linearGradient id="riderSpeedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <filter id="riderShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF5500" flood-opacity="0.35" />
    </filter>

    <filter id="riderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#riderBgGrad)" stroke="#FF5500" stroke-width="4" stroke-opacity="0.75" filter="url(#riderShadow)" />

  <!-- Dynamic Velocity Rings & Speed Streaks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FF5500" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#FFA439" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="8 8" />

  <!-- Speed Motion Trails (Wind streaks) -->
  <path d="M 60 190 L 150 190" stroke="#FF7A00" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M 40 230 L 120 230" stroke="#FF7A00" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 70 270 L 140 270" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Rider Aerodynamic Delivery Motif -->
  <g transform="translate(256, 252)" filter="url(#riderShadow)">
    <!-- Aerodynamic Speed Wing (Top) -->
    <path d="M -85 -105 L 85 -105 C 135 -105, 165 -65, 140 -20 L 75 -20 C 90 -45, 75 -65, 45 -65 L -45 -65 L -45 -105 Z" 
          fill="url(#riderFireGrad)" />

    <!-- Center Forward Courier Helmet / Speed Crest -->
    <path d="M -90 -45 L 30 -45 C 80 -45, 115 -15, 105 35 C 95 80, 50 105, -15 105 L -90 105 Z" 
          fill="url(#riderFireGrad)" />

    <!-- Visor Speed Line / Electric Cyan Flash -->
    <path d="M -20 -15 L 60 -15 C 85 -15, 95 0, 85 25 L -20 25 Z" 
          fill="#FFFFFF" opacity="0.95" />
    <path d="M -15 -5 L 50 -5 C 65 -5, 72 2, 65 15 L -15 15 Z" 
          fill="#38BDF8" opacity="0.9" />

    <!-- Lightning Speed Bolt / Delivery Arrow Fused -->
    <polygon points="5,50 65,50 35,90 85,90 0,165 20,105 -25,105" 
             fill="url(#riderSpeedGrad)" filter="url(#riderGlow)" />

    <!-- Dynamic Inset 'E' Cuts -->
    <rect x="-90" y="-105" width="36" height="210" rx="10" fill="url(#riderFireGrad)" />

    <!-- Fast Parcel Tag Behind Bolt -->
    <rect x="-35" y="45" width="22" height="45" rx="5" fill="#FFE600" opacity="0.85" />
  </g>

  <!-- High-Velocity Dispatch Stars -->
  <circle cx="410" cy="130" r="5" fill="#FFE600" filter="url(#riderGlow)" />
  <circle cx="435" cy="155" r="3" fill="#FF7A00" />
</svg>