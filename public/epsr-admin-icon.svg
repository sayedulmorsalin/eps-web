<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Admin Deep Midnight Charcoal Canvas -->
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="60%" stop-color="#12161C" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>

    <!-- Gold & Orange Executive Trim -->
    <linearGradient id="adminGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="adminOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84A" />
      <stop offset="50%" stop-color="#F48721" />
      <stop offset="100%" stop-color="#D45C00" />
    </linearGradient>

    <linearGradient id="adminShieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262D38" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <filter id="adminShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#adminBgGrad)" stroke="url(#adminGoldGrad)" stroke-width="4" stroke-opacity="0.8" filter="url(#adminShadow)" />

  <!-- Concentric Security Radar / Telemetry Grid -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.1" />

  <!-- Shield of Authority -->
  <g transform="translate(256, 260)" filter="url(#adminShadow)">
    <!-- Outer Shield Crest -->
    <path d="M 0 -150 L 135 -90 L 135 30 C 135 115, 65 170, 0 195 C -65 170, -135 115, -135 30 L -135 -90 Z" 
          fill="url(#adminShieldInner)" stroke="url(#adminGoldGrad)" stroke-width="5" />

    <!-- Inner Shield Inset Line -->
    <path d="M 0 -130 L 115 -80 L 115 25 C 115 95, 55 145, 0 170 C -55 145, -115 95, -115 25 L -115 -80 Z" 
          fill="none" stroke="#F48721" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />

    <!-- Executive Crown / Command Nodes atop Shield -->
    <g transform="translate(0, -95)">
      <!-- 3 Golden Nodes -->
      <circle cx="-60" cy="0" r="7" fill="url(#adminGoldGrad)" />
      <circle cx="0" cy="-14" r="10" fill="url(#adminGoldGrad)" />
      <circle cx="60" cy="0" r="7" fill="url(#adminGoldGrad)" />
      <!-- Connection bridge -->
      <path d="M -60 0 L 0 -14 L 60 0" fill="none" stroke="url(#adminGoldGrad)" stroke-width="3" />
    </g>

    <!-- Core EPSR Monogram Inside Shield -->
    <g transform="translate(0, 10)">
      <!-- Dynamic 'E' and Command Gear -->
      <!-- Left Stem -->
      <rect x="-65" y="-55" width="24" height="110" rx="8" fill="url(#adminOrangeGrad)" />
      <!-- Top Arm -->
      <path d="M -65 -55 L 45 -55 C 60 -55, 70 -45, 70 -30 L -41 -30 L -41 -55 Z" fill="url(#adminOrangeGrad)" />
      <!-- Middle Command Key Arm -->
      <path d="M -65 -2 L 25 -2 C 38 -2, 45 6, 45 16 C 45 26, 38 34, 25 34 L -41 34 L -41 -2 Z" fill="url(#adminGoldGrad)" />
      <!-- Bottom Arm -->
      <path d="M -65 55 L 50 55 C 65 55, 75 45, 75 30 L -41 30 L -41 55 Z" fill="url(#adminOrangeGrad)" />
      <!-- Center Security Lock / Keyhole Core -->
      <circle cx="0" cy="16" r="6" fill="#12161C" />
      <path d="M -2 16 L -4 30 L 4 30 L 2 16 Z" fill="#12161C" />
    </g>

    <!-- Admin Status Banner at Bottom -->
    <g transform="translate(0, 130)">
      <rect x="-60" y="-12" width="120" height="24" rx="12" fill="url(#adminGoldGrad)" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="2.5" fill="#12161C" text-anchor="middle">
        ADMIN
      </text>
    </g>
  </g>
</svg>