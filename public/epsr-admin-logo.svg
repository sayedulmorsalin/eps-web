<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="adminLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="adminLogoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB054" />
      <stop offset="50%" stop-color="#F48721" />
      <stop offset="100%" stop-color="#DE6700" />
    </linearGradient>

    <linearGradient id="adminLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#0F1216" />
    </linearGradient>

    <filter id="admLogoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="132" height="132" rx="32" fill="url(#adminLogoBg)" stroke="url(#adminLogoGold)" stroke-width="2.5" stroke-opacity="0.8" filter="url(#admLogoShadow)" />

    <!-- Mini Shield & Monogram -->
    <g transform="translate(66, 68) scale(0.42)">
      <!-- Shield -->
      <path d="M 0 -130 L 110 -75 L 110 25 C 110 95, 55 140, 0 160 C -55 140, -110 95, -110 25 L -110 -75 Z" fill="#262D38" stroke="url(#adminLogoGold)" stroke-width="6" />
      <!-- Triple Nodes -->
      <circle cx="-50" cy="-60" r="8" fill="url(#adminLogoGold)" />
      <circle cx="0" cy="-75" r="10" fill="url(#adminLogoGold)" />
      <circle cx="50" cy="-60" r="8" fill="url(#adminLogoGold)" />
      <!-- Letter E -->
      <rect x="-50" y="-40" width="22" height="90" rx="6" fill="url(#adminLogoOrange)" />
      <path d="M -50 -40 L 35 -40 C 45 -40, 55 -32, 55 -20 L -28 -20 L -28 -40 Z" fill="url(#adminLogoOrange)" />
      <path d="M -50 0 L 20 0 C 30 0, 38 6, 38 14 C 38 22, 30 28, 20 28 L -28 28 L -28 0 Z" fill="url(#adminLogoGold)" />
      <path d="M -50 50 L 40 50 C 50 50, 60 40, 60 28 L -28 28 L -28 50 Z" fill="url(#adminLogoOrange)" />
    </g>
  </g>

  <!-- Right Typography & Badging -->
  <g transform="translate(175, 0)">
    <!-- EPSR text -->
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" letter-spacing="3" fill="#FFFFFF">
      EP<tspan fill="url(#adminLogoOrange)">SR</tspan>
    </text>

    <!-- ADMIN Pill Badge -->
    <g transform="translate(195, 30)">
      <rect x="0" y="0" width="138" height="42" rx="21" fill="url(#adminLogoGold)" />
      <text x="69" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="3" fill="#0F172A" text-anchor="middle">
        ADMIN
      </text>
    </g>

    <!-- Subtitle -->
    <text x="3" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" letter-spacing="5" fill="#94A3B8">
      ENTERPRISE CONTROL &amp; ANALYTICS
    </text>

    <!-- Accent line -->
    <rect x="3" y="128" width="120" height="3" rx="1.5" fill="url(#adminLogoGold)" />
    <rect x="130" y="128" width="45" height="3" rx="1.5" fill="url(#adminLogoOrange)" />
  </g>
</svg>