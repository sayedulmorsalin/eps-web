<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="epsrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242122" />
      <stop offset="50%" stop-color="#1B1819" />
      <stop offset="100%" stop-color="#121011" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="epsrRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA439" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F48721" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.6" />
    </linearGradient>

    <!-- Primary Brand Orange Gradient -->
    <linearGradient id="epsrOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB054" />
      <stop offset="40%" stop-color="#F48721" />
      <stop offset="100%" stop-color="#DE6700" />
    </linearGradient>

    <!-- Warm Amber / Parcel Accent -->
    <linearGradient id="epsrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD666" />
      <stop offset="100%" stop-color="#FFA940" />
    </linearGradient>

    <!-- Deep Shadow Drop -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F48721" flood-opacity="0.25" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#epsrBgGrad)" stroke="url(#epsrRimGrad)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Subtle Speed Track / Ring Geometry -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#F48721" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="205" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05" />

  <!-- EPSR Dynamic Emblem Group -->
  <g transform="translate(256, 256)" filter="url(#dropShadow)">
    <!-- Dynamic Forward Delivery Arrow / Fast Hexagon Motif -->
    <!-- Top Speed Wing / "E" Top Arm -->
    <path d="M -115 -95 L 45 -95 C 75 -95, 95 -80, 115 -55 L 75 -20 C 65 -35, 50 -45, 25 -45 L -65 -45 L -65 -95 Z" 
          fill="url(#epsrOrangeGrad)" />

    <!-- Fast Parcel Core / Hexagonal Delivery Box -->
    <g transform="translate(15, -5)">
      <!-- Isometric Top Face -->
      <path d="M 0 -45 L 65 -15 L 0 15 L -65 -15 Z" fill="url(#epsrGoldGrad)" />
      <!-- Isometric Right Face -->
      <path d="M 65 -15 L 65 50 L 0 80 L 0 15 Z" fill="url(#epsrOrangeGrad)" />
      <!-- Isometric Left Face -->
      <path d="M -65 -15 L 0 15 L 0 80 L -65 50 Z" fill="#D45C00" />
      <!-- Parcel Tape / Ribbon Accent -->
      <path d="M 0 -45 L 0 15 L 0 80" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />
      <path d="M -65 -15 L 0 15 L 65 -15" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />
    </g>

    <!-- "E" Mid Pulse Streamer -->
    <path d="M -115 -20 L -65 -20 L -65 20 L -115 20 Z" fill="url(#epsrGoldGrad)" rx="8" />

    <!-- "E" Bottom Foundation Sweep -->
    <path d="M -115 95 L 45 95 C 75 95, 100 80, 120 50 L 75 25 C 65 40, 50 50, 20 50 L -65 50 L -65 95 Z" 
          fill="url(#epsrOrangeGrad)" />

    <!-- Vertical Spine of "E" -->
    <rect x="-115" y="-95" width="50" height="190" rx="14" fill="url(#epsrOrangeGrad)" />

    <!-- Forward Delivery Speed Chevron -->
    <path d="M 85 -5 L 125 25 L 85 55" fill="none" stroke="url(#epsrGoldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle / Delivery Precision Star -->
  <path d="M 390 115 Q 390 135 410 135 Q 390 135 390 155 Q 390 135 370 135 Q 390 135 390 115 Z" 
        fill="#FFD666" filter="url(#glowFilter)" />
</svg>